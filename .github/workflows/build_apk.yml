name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, feature/ai-chat-sessions]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase configuration
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
        run: |
          for name in FB_API_KEY FB_APP_ID FB_PROJECT_ID FB_SENDER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing. Add all four FB_* repository secrets."
              exit 1
            fi
          done

      - name: Check free AI Worker JavaScript
        run: |
          cd workers
          npm install --no-audit --no-fund
          npm run check
          cd ..

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.omstudy --project-name om_study_ai .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text(encoding='utf-8')
          permission = '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
          if 'android.permission.RECORD_AUDIO' not in s:
              s = s.replace('<application', permission + '    <application', 1)
          p.write_text(s, encoding='utf-8')
          PY
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - name: Generate Firebase configuration source
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          values = {
              "firebaseApiKey": os.environ["FB_API_KEY"],
              "firebaseAppId": os.environ["FB_APP_ID"],
              "firebaseProjectId": os.environ["FB_PROJECT_ID"],
              "firebaseSenderId": os.environ["FB_SENDER_ID"],
          }
          with open("lib/firebase_build_config.dart", "w", encoding="utf-8") as f:
              for name, value in values.items():
                  f.write(f"const {name} = {json.dumps(value)};\n")
          PY

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build release APK
        env:
          AI_WORKER_URL: ${{ secrets.AI_WORKER_URL }}
        run: |
          flutter build apk --release --dart-define=AI_WORKER_URL="$AI_WORKER_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: om-study-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
