name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.omstudy --project-name om_study_ai .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test

      - run: flutter pub get

      - name: Check secrets format
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
        run: |
          fail=0
          case "$FB_API_KEY" in AIza*) ;; *) echo "FB_API_KEY galat hai (AIza se shuru hona chahiye)"; fail=1;; esac
          case "$FB_APP_ID" in 1:*:android:*) ;; *) echo "FB_APP_ID galat hai (1:...:android:... jaisa hona chahiye)"; fail=1;; esac
          case "$FB_SENDER_ID" in ''|*[!0-9]*) echo "FB_SENDER_ID sirf ank hona chahiye"; fail=1;; esac
          if [ -z "$FB_PROJECT_ID" ]; then echo "FB_PROJECT_ID khali hai"; fail=1; fi
          case "$FB_API_KEY$FB_APP_ID$FB_PROJECT_ID$FB_SENDER_ID" in *'"'*|*' '*|*','*) echo "Kisi secret me quote, space ya comma hai"; fail=1;; esac
          exit $fail

      - name: Build release APK
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
        run: |
          flutter build apk --release \
            --dart-define=FB_API_KEY="$FB_API_KEY" \
            --dart-define=FB_APP_ID="$FB_APP_ID" \
            --dart-define=FB_PROJECT_ID="$FB_PROJECT_ID" \
            --dart-define=FB_SENDER_ID="$FB_SENDER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: om-study-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
