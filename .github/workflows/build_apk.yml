name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FB_API_KEY: ${{ secrets.FB_API_KEY }}
  FB_APP_ID: ${{ secrets.FB_APP_ID }}
  FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
  FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Firebase configuration
        run: |
          for name in FB_API_KEY FB_APP_ID FB_PROJECT_ID FB_SENDER_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret $name is missing. Add all four FB_* repository secrets."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.omstudy --project-name om_study_ai .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml

      - run: flutter pub get

      - name: Create Firebase build defines
        env:
          FB_API_KEY: ${{ secrets.FB_API_KEY }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_PROJECT_ID: ${{ secrets.FB_PROJECT_ID }}
          FB_SENDER_ID: ${{ secrets.FB_SENDER_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          keys = ["FB_API_KEY", "FB_APP_ID", "FB_PROJECT_ID", "FB_SENDER_ID"]
          with open("/tmp/firebase-defines.json", "w", encoding="utf-8") as f:
              json.dump({key: os.environ[key] for key in keys}, f)
          PY

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=/tmp/firebase-defines.json

      - uses: actions/upload-artifact@v4
        with:
          name: om-study-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
