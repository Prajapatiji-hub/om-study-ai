name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  FB_API_KEY: AIzaSyADDOa-s0yNxy78fLYbNAHKe84Ui33tuG8
  FB_APP_ID: 1:1058735430910:android:9310dc10bf4dd731a999af
  FB_PROJECT_ID: prajapati-507d7
  FB_SENDER_ID: "1058735430910"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --org com.omstudy --project-name om_study_ai .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test

      - run: flutter pub get

      - name: Build release APK
        run: |
          flutter build apk --release \
            --dart-define=FB_API_KEY="$FB_API_KEY" \
            --dart-define=FB_APP_ID="$FB_APP_ID" \
            --dart-define=FB_PROJECT_ID="$FB_PROJECT_ID" \
            --dart-define=FB_SENDER_ID="$FB_SENDER_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: om-study-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
